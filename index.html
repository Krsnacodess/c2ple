<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Couple Signals 💗</title>
</head>

<body>

  <h1>Couple Signals 💗</h1>

  <button id="enableNotifications">
    🔔 Enable Notifications
  </button>

  <p id="status">Notifications are not enabled.</p>
<section id="coupleSection">

  <h2>❤️ Couple Pairing</h2>

  <button id="createCouple">
    Create Couple ❤️
  </button>

  <div id="pairCodeBox" style="display:none;">

    <p>Your Couple Code:</p>

    <h1 id="pairCode"></h1>

    <p>Give this code to your partner 💕</p>

  </div>


  <hr>


  <p>Already have a code?</p>

  <input
    id="joinCode"
    type="text"
    maxlength="6"
    placeholder="Enter 6-character code"
  >

  <button id="joinCouple">
    Join Couple 💕
  </button>

  <p id="coupleStatus"></p>

</section>
  <script type="module" src="script.js"></script>

</body>
</html>
